server {
    listen 80;

    # Substitua "_" pelo seu domínio, ex: server_name meumercadofacil.com;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de segurança ──────────────────────────────────────────────
    # CSP: mantém tudo em 'self'; permite conexões HTTPS/WSS (Supabase + API),
    # imagens data/blob (preview do cupom) e estilos inline (Tailwind/shadcn).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Cache de assets versionados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Não cachear o service worker (para o autoUpdate do PWA funcionar)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # React Router: cai para index.html quando não for arquivo real
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

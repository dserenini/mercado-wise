name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar libs de sistema (zbar/opencv)
        run: sudo apt-get update && sudo apt-get install -y libzbar0 libgl1 libglib2.0-0
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  # ── CD: publica em produção na VPS ──────────────────────────────────────
  # Só roda em push na main e SOMENTE se o CI (frontend + backend) passou.
  # Substitui o passo manual "SSH na VPS + git pull + docker compose up".
  deploy:
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Evita dois deploys simultâneos (ex.: dois pushes seguidos).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Aborta o deploy se qualquer comando falhar.
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            echo "→ Atualizando código (origin/main)…"
            git fetch --all --prune
            git reset --hard origin/main
            echo "→ Rebuild e subida dos containers…"
            docker compose up -d --build
            echo "→ Removendo imagens órfãs…"
            docker image prune -f
            echo "✓ Deploy concluído."

name: CI

# Confere cada pull request e cada push na main (só na main: num PR, o push da
# branch já dispara o pull_request, e rodaria duas vezes). O deploy é da Vercel (integração com o GitHub),
# não deste workflow. Os testes usam PGlite (Postgres em memória): sem segredos aqui.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

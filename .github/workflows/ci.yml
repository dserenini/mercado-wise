name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint é advisory por enquanto: há dívida pré-existente (uso de `any`,
      # require no tailwind.config). Não bloqueia o CI até essa limpeza ser feita.
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar libs de sistema (zbar/opencv)
        run: sudo apt-get update && sudo apt-get install -y libzbar0 libgl1 libglib2.0-0
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
